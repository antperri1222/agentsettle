[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 120

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
